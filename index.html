<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zendure & Tibber Steuerung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a40;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #00bcd4;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }
        .card {
            background: #3a3a55;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .label {
            font-size: 0.85rem;
            color: #aaa;
        }
        .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        .highlight {
            color: #ffeb3b;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ddd;
        }
        input[type="number"], input[type="time"] {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary {
            background: #00bcd4;
            color: #121212;
        }
        .btn-success {
            background: #4caf50;
            color: #fff;
        }
        .btn-danger {
            background: #f44336;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Zendure & Tibber</h2>
    
    <!-- Live-Werte -->
    <div class="card">
        <div class="label">Aktueller Strompreis</div>
        <div class="value highlight" id="tibber-price">-- ct/kWh</div>
    </div>

    <div class="card">
        <div class="label">Aktueller Hausverbrauch (Live)</div>
        <div class="value" id="tibber-power">-- W</div>
    </div>

    <!-- Steuerung -->
    <div class="card">
        <div class="input-group">
            <label for="price-limit">Max. Preisgrenze (Ct/kWh):</label>
            <input type="number" id="price-limit" value="25.0" step="0.5">
        </div>

        <div class="input-group">
            <label for="time-start">Ladezeit von:</label>
            <input type="time" id="time-start" value="00:00">
        </div>

        <div class="input-group">
            <label for="time-end">Bis Uhrzeit:</label>
            <input type="time" id="time-end" value="06:00">
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">Einstellungen speichern</button>
    </div>

    <div class="card">
        <div class="label" style="margin-bottom: 10px;">Manuelle Steuerung</div>
        <button class="btn btn-success" onclick="triggerAction('FORCE_CHARGE')">Speicher JETZT laden</button>
        <button class="btn btn-danger" onclick="triggerAction('NORMAL')">Laden stoppen / Normal</button>
    </div>
</div>

<script>
    function saveSettings() {
        const limit = document.getElementById('price-limit').value;
        const start = document.getElementById('time-start').value;
        const end = document.getElementById('time-end').value;
        alert("Einstellungen gespeichert!\nMax. Preis: " + limit + " Ct\nZeitfenster: " + start + " bis " + end + " Uhr");
    }

    function triggerAction(action) {
        if(action === 'FORCE_CHARGE') {
            alert("Befehl gesendet: Speicher wird geladen!");
        } else {
            alert("Befehl gesendet: Normalbetrieb.");
        }
    }
</script>

</body>
</html>
