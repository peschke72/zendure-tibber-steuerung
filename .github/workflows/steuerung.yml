name: Zendure Tibber Steuerung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Hauptskript ausführen
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
        run: python main.py

      - name: Git-Konflikte vorbeugen (Pull Rebase)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "Kein Rebase nötig oder erfolgreich"

      - name: data.json automatisch committen und pushen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update data.json automatisch [skip ci]"
          file_pattern: data.json
