name: Zendure Tibber Steuerung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skript ausführen (mit automatischer Ordnererkennung)
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          ZENDURE_EMAIL: ${{ secrets.ZENDURE_EMAIL }}
          ZENDURE_PASSWORD: ${{ secrets.ZENDURE_PASSWORD }}
        run: |
          if [ -d "zendure-tibber-steuerung" ]; then
            cd zendure-tibber-steuerung
          fi
          python main.py

      - name: data.json committen
        run: |
          if [ -d "zendure-tibber-steuerung" ]; then
            cd zendure-tibber-steuerung
          fi
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add data.json
          git commit -m "Update data.json automatisch [skip ci]" || echo "Keine Änderungen zum Committen"
          git push origin main
