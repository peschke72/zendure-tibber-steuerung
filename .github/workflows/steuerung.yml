name: Zendure Tibber Steuerung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Läuft standardmäßig stündlich

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit das Skript Änderungen speichern darf!
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Hauptskript ausführen
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          ZENDURE_EMAIL: ${{ secrets.ZENDURE_EMAIL }}
          ZENDURE_PASSWORD: ${{ secrets.ZENDURE_PASSWORD }}
        run: python main.py

      - name: data.json ins Repository committen
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git commit -m "Automatisches Update der data.json [skip ci]" || echo "Keine Änderungen zum Speichern"
          git push
