name: Zendure Tibber Steuerung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Läuft stündlich

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt das Speichern von Dateien im Repository
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Hauptskript ausführen
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          ZENDURE_EMAIL: ${{ secrets.ZENDURE_EMAIL }}
          ZENDURE_PASSWORD: ${{ secrets.ZENDURE_PASSWORD }}
        run: python main.py

      - name: Prüfen und data.json committen
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          
          # Prüfen, ob data.json existiert, falls nicht eine Dummy-Datei erstellen
          if [ ! -f data.json ]; then
            echo '{"price": 0, "power": 0, "status": "Initialisierung"}' > data.json
          fi
          
          git add data.json
          git commit -m "Automatisches Update der data.json [skip ci]" || echo "Keine Änderungen zum Speichern"
          git push origin main || git push
