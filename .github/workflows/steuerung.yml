name: Zendure Tibber Steuerung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Hauptskript ausführen
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
        run: python main.py

      - name: data.json automatisch committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update data.json automatisch [skip ci]"
          file_pattern: data.json
